# Builds the extension ZIP and publishes it as an immutable GitHub release.
#
# How to release: set the new version in manifest.json, LICENSE and
# THIRD-PARTY-NOTICES.txt, push to main, then Actions → Release → Run workflow.
# The release gets the tag v<version> and the ZIP pilbot-<version>.zip.
#
# Security:
# - Only people with write access can run it, and only from main.
# - No permissions by default; each job gets only what it needs.
# - Actions are GitHub's own, pinned to a full commit SHA.
# - The ZIP gets a signed build provenance attestation.
# - The release is created as a draft, the ZIP is attached, then it's published
#   (GitHub's recommended order for immutable releases).

name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ZIP
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        id: version
        run: |
          version="$(jq -r '.version' manifest.json)"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error file=manifest.json::Invalid version in manifest.json: $version"
            exit 1
          fi
          for file in LICENSE THIRD-PARTY-NOTICES.txt; do
            if ! grep -qF "Pilbot $version" "$file"; then
              echo "::error file=$file::$file doesn't mention Pilbot $version. Set the same version as in manifest.json."
              exit 1
            fi
          done
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error file=manifest.json::Tag v$version already exists. Raise the version in manifest.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the ZIP
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s failglob
          name="pilbot-$VERSION.zip"
          files=(manifest.json LICENSE THIRD-PARTY-NOTICES.txt *.js *.html styles.css icons/*.png)
          # Same timestamps on every build of the same commit.
          touch -d "@$(git log -1 --format=%ct)" "${files[@]}"
          mkdir dist
          TZ=UTC zip -X -D "dist/$name" "${files[@]}"
          unzip -l "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Upload the ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilbot-zip
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilbot-zip
          path: dist

      - name: Create a draft, attach the ZIP, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" "dist/$ZIP" \
            --draft \
            --target "$TARGET" \
            --title "Pilbot $VERSION" \
            --generate-notes
          gh release edit "$tag" --draft=false
          echo "Published: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
