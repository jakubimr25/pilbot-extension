<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Allow the microphone</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="microphone.js"></script>
  </head>
  <body>
    <!-- Opened in a tab from the side panel's Voice view, or when dictation starts without access. -->
    <main class="permission">
      <div class="empty">
        <span class="empty-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
            />
          </svg>
        </span>
        <h1 class="empty-title">Allow the microphone</h1>
        <p class="empty-hint">
          Dictation records only while you dictate into a text field. The audio is sent straight to the AI
          provider you set up to be typed out; Pilbot does not keep it.
        </p>
        <p id="mic-status" class="permission-status" aria-live="polite"></p>
        <button type="button" id="mic-allow" class="button tonal" hidden>Allow microphone</button>
      </div>
    </main>
  </body>
</html>
